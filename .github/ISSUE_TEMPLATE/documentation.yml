name: Documentation
description: Improve README, screenshots, release notes, or guides.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: page
    attributes:
      label: Documentation area
      description: Which document or section should change?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: What should be added, removed, or clarified?
    validations:
      required: true
